name: Week 12 Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install from lock file
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo configuration check
        run: npm run check
